<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="navy" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#263d68"/>
      <stop offset="52%" stop-color="#132848"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf1bf"/>
      <stop offset="16%" stop-color="#ecce74"/>
      <stop offset="50%" stop-color="#c1901c"/>
      <stop offset="84%" stop-color="#eccd74"/>
      <stop offset="100%" stop-color="#7d5a10"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef6cd"/>
      <stop offset="48%" stop-color="#ecce78"/>
      <stop offset="100%" stop-color="#b0821c"/>
    </linearGradient>
    <path id="topArc" d="M 66,214 A 144,144 0 0 1 354,214" fill="none"/>
    <path id="botArc" d="M 88,212 A 122,122 0 0 0 332,212" fill="none"/>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- RING -->
  <g filter="url(#soft)">
    <circle cx="210" cy="210" r="205" fill="#4d380b"/>
    <circle cx="210" cy="210" r="199" fill="url(#gold)"/>
    <circle cx="210" cy="210" r="199" fill="none" stroke="#3a2a08" stroke-width="1.5"/>
    <circle cx="210" cy="210" r="172" fill="url(#navy)"/>
  </g>
  <circle cx="210" cy="210" r="172" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <circle cx="210" cy="210" r="164" fill="none" stroke="#d9b452" stroke-opacity="0.55" stroke-width="1"/>

  <!-- ARCHED TITLE -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="7" fill="url(#goldText)">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">APOCALYPTO</textPath>
  </text>
  <g fill="url(#goldText)">
    <rect x="66" y="204" width="11" height="11" transform="rotate(45 71.5 209.5)"/>
    <rect x="343" y="204" width="11" height="11" transform="rotate(45 348.5 209.5)"/>
  </g>

  <!-- CENTER: APO -->
  <text x="210" y="226" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="82" letter-spacing="5" fill="url(#goldText)">APO</text>

  <!-- CANDLESTICKS (uptrend, rapi) -->
  <g>
    <!-- garis tren emas tipis -->
    <polyline points="168,272 190,264 212,252 234,256 256,240" fill="none" stroke="#e7c766" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g filter="url(#cshadow)" stroke-linecap="round">
    <!-- c1 red -->
    <line x1="168" y1="262" x2="168" y2="290" stroke="#c93b30" stroke-width="2.4"/>
    <rect x="163" y="270" width="10" height="15" rx="2.5" fill="#e2493d" stroke="#8f2a22" stroke-width="0.8"/>
    <!-- c2 green -->
    <line x1="190" y1="252" x2="190" y2="284" stroke="#0f8f53" stroke-width="2.4"/>
    <rect x="185" y="260" width="10" height="18" rx="2.5" fill="#1cc276" stroke="#0c7a46" stroke-width="0.8"/>
    <!-- c3 green (besar) -->
    <line x1="212" y1="240" x2="212" y2="278" stroke="#0f8f53" stroke-width="2.4"/>
    <rect x="207" y="248" width="10" height="22" rx="2.5" fill="#1cc276" stroke="#0c7a46" stroke-width="0.8"/>
    <!-- c4 red -->
    <line x1="234" y1="248" x2="234" y2="282" stroke="#c93b30" stroke-width="2.4"/>
    <rect x="229" y="256" width="10" height="16" rx="2.5" fill="#e2493d" stroke="#8f2a22" stroke-width="0.8"/>
    <!-- c5 green (tertinggi) -->
    <line x1="256" y1="230" x2="256" y2="268" stroke="#0f8f53" stroke-width="2.4"/>
    <rect x="251" y="238" width="10" height="22" rx="2.5" fill="#1cc276" stroke="#0c7a46" stroke-width="0.8"/>
  </g>

  <!-- BOTTOM TAGLINE -->
  <text font-family="'Trebuchet MS', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="6" fill="url(#goldText)">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">EXPERT ADVISOR</textPath>
  </text>
</svg>
